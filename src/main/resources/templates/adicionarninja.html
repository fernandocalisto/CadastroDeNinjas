<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Shinobi</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .form-card { background-color: var(--bg-panel); border-radius: 12px; padding: 2.5rem; max-width: 600px; margin: 0 auto; border-top: 4px solid var(--accent-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: var(--text-muted); margin-bottom: 0.5rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-main); color: var(--text-main); font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: var(--accent-blue); }
        .form-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 2rem; }
        button { border: none; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 2rem;"><span class="highlight">Novo</span> Shinobi</h1>

    <div class="form-card">
        <form th:action="@{/ninja/ui/save}" th:object="${ninja}" method="post">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label for="age">Idade</label>
                <input type="number" id="age" th:field="*{age}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="rank">Rank</label>
                <select id="rank" th:field="*{rank}">
                    <option value="Estudante">Estudante</option>
                    <option value="Gennin">Gennin</option>
                    <option value="Chunnin">Chunnin</option>
                    <option value="Jounnin">Jounnin</option>
                    <option value="ANBU">ANBU</option>
                    <option value="Kage">Kage</option>
                </select>
            </div>

            <div class="form-actions">
                <a th:href="@{/ninja/ui/all}" class="btn btn-delete">Cancelar</a>
                <button type="submit" class="btn btn-edit" style="background-color: #10b981;">Cadastrar</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
